schema_version: "1.0"
generated_at: 2026-11-08
verification_policy: >-
  Version and license data must be traceable to official upstream repositories,
  release pages, or documentation. UNVERIFIED values cannot be enabled.
priority_mapping:
  CORE: Required by the current inspection lifecycle.
  SECONDARY: Next complementary integration with a bounded adapter.
  OPTIONAL: Deployment-specific extension, disabled by default.
  FUTURE: Reserved architecture requiring a later implementation decision.

tools:
  - id: syft
    name: Syft
    category: sbom-generator
    official_source: https://github.com/anchore/syft
    documentation: https://oss.anchore.com/docs/guides/sbom/
    verified_version: v1.57.0
    version_status: verified
    release_verified_at: 2026-11-08
    license:
      name: Apache License 2.0
      spdx: Apache-2.0
      source: https://github.com/anchore/syft/blob/v1.57.0/LICENSE
    installation:
      method: container-stage
      locator: anchore/syft:v1.57.0
      pinned: true
    capabilities: [component-discovery, sbom-generation, image-cataloging, filesystem-cataloging]
    responsibility: Discover packages and relationships and emit an SBOM.
    boundary: Does not provide vulnerability verdicts, signatures, or policy decisions.
    dependencies: [registry-or-filesystem-access]
    supported:
      operating_systems: [Linux, macOS, Windows]
      architectures: [amd64, arm64]
      input_formats: [OCI-image, docker-archive, OCI-archive, directory, file]
      output_formats: [syft-json, CycloneDX-JSON, CycloneDX-XML, SPDX-JSON, SPDX-tag-value]
    interfaces: [CLI, Go-library]
    configuration:
      required: [scan-source]
      authentication: Registry credentials are source-specific and optional.
      secrets: [registry-credentials]
    priority: CORE
    tags: [prompt-01]
    enablement:
      status: enabled
      current_integration: worker/Dockerfile and worker/tasks.py
      rationale: Primary Prompt 01 SBOM generator.
    health_check:
      required: true
      method: CLI
      target: syft version
    security_considerations:
      - Treat scanned content and registry metadata as untrusted.
      - Bound network access, execution time, memory, and output size.
    maintenance:
      status: active
      release_evidence: https://github.com/anchore/syft/releases/tag/v1.57.0
    sources:
      - https://github.com/anchore/syft/releases/tag/v1.57.0
      - https://github.com/anchore/syft/blob/v1.57.0/README.md

