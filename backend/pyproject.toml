[project]
name = "chainguard-backend"
version = "0.1.0"
description = "ChainGuard OSS API and scanner worker"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "celery[redis]==5.7.0",
  "fastapi==0.162.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.8",
  "pydantic-settings==2.16.2",
  "python-json-logger==4.2.0",
  "python-multipart==0.0.33",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "sqlalchemy==2.1.8",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
