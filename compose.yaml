name: chainguard-oss

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/2
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
  SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-900}
  DEPENDENCY_TRACK_URL: ${DEPENDENCY_TRACK_URL:-http://dependency-track-api:8080}
  DEPENDENCY_TRACK_API_KEY: ${DEPENDENCY_TRACK_API_KEY:-}

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *app-environment
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, public]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment: *app-environment
    volumes:
      - uploads:/data/uploads:ro
      - grype-db:/data/grype-db
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
          pids: 256

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${UI_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [public]
    deploy:
      resources:
        limits:
          memory: 128M

  dtrack-postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${DTRACK_POSTGRES_USER:?set DTRACK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DTRACK_POSTGRES_PASSWORD:?set DTRACK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DTRACK_POSTGRES_DB:?set DTRACK_POSTGRES_DB}
    volumes:
      - dtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [dtrack]
    deploy:
      resources:
        limits:
          memory: 1G

  dependency-track-api:
    image: dependencytrack/apiserver:4.13.6
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://dtrack-postgres:5432/${DTRACK_POSTGRES_DB:?set DTRACK_POSTGRES_DB}
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: ${DTRACK_POSTGRES_USER:?set DTRACK_POSTGRES_USER}
      ALPINE_DATABASE_PASSWORD: ${DTRACK_POSTGRES_PASSWORD:?set DTRACK_POSTGRES_PASSWORD}
      ALPINE_CORS_ENABLED: "true"
      ALPINE_CORS_ALLOW_ORIGIN: ${DTRACK_CORS_ORIGIN:-http://localhost:8081}
      JAVA_OPTIONS: -Xms1g -Xmx4g
    volumes:
      - dtrack-data:/data
    ports:
      - "${DTRACK_API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    depends_on:
      dtrack-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, dtrack]
    deploy:
      resources:
        limits:
          memory: 5G

  dependency-track-frontend:
    image: dependencytrack/frontend:4.13.6
    environment:
      API_BASE_URL: ${DTRACK_PUBLIC_API_URL:-http://localhost:8082}
    ports:
      - "${DTRACK_UI_PORT:-8081}:8080"
    depends_on:
      dependency-track-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [dtrack, public]
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  public:
  internal:
    internal: false
  dtrack:
    internal: true

volumes:
  postgres-data:
  redis-data:
  uploads:
  grype-db:
  dtrack-postgres-data:
  dtrack-data:
